name: Refresh IPO numbers

on:
  schedule:
    - cron: "*/30 3-11 * * 1-5"   # every 30 min, 08:30–17:00 IST, weekdays
    - cron: "30 12 * * 1-5"       # 18:00 IST: settled last-day numbers
    - cron: "30 4 * * 0,6"        # 10:00 IST weekends: GMP still moves
  push:
    branches: [main]
    paths: ["data/notes.json", "data/backfill.json", "config.json", "*.py", ".github/workflows/refresh.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch numbers (no YouTube from cloud IPs)
        run: python fetch.py --numbers || echo "::warning::some sources failed; see the page banner"
      - name: Update track record
        run: python results.py
      - name: Render page and calendar
        run: python render.py
      - name: Save track record
        run: |
          if ! git diff --quiet -- data/results.json; then
            git config user.name "ipo-tracker bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/results.json
            git commit -m "results: update track record [skip ci]"
            git pull --rebase --quiet && git push --quiet
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
